# Fake values: tests never call GitHub
github.client-id=test-client-id
github.client-secret=test-client-secret
# Controller tests share one context and IP; RateLimitTest sets its own low limit
rate-limit.login-per-email=1000
rate-limit.login-per-ip=1000
rate-limit.public-per-ip=1000
rate-limit.account-per-user=1000
